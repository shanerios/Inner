<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b20" />
  <meta name="description" content="Continue your Little Explorer adventure with Inner." />
  <title>Continue the Adventure | Inner</title>
  <link rel="canonical" href="https://inner.chottu.link/explorer" />
  <meta http-equiv="refresh" content="0; url=https://inner.chottu.link/explorer" />

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b20;
      color: #f7f5ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      text-align: center;
      background:
        radial-gradient(circle at 50% 20%, rgba(140, 122, 255, 0.18), transparent 34rem),
        linear-gradient(180deg, #080819 0%, #111129 100%);
    }

    main {
      width: min(100%, 32rem);
    }

    .spark {
      width: min(280px, 64vw);
      height: min(280px, 64vw);
      margin: 0 auto 1.5rem;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 0 1.75rem rgba(151, 133, 255, 0.4));
    }

    p {
      margin: 0 auto;
      color: rgba(239, 235, 255, 0.7);
      font-size: 1rem;
      line-height: 1.6;
    }

    a {
      color: #c8beff;
    }
  </style>

  <script>
    // Forward the full path/query/hash so any ChottuLink attribution
    // params (click id, campaign, etc.) survive the redirect.
    (function () {
      var dest = "https://inner.chottu.link/explorer" + window.location.search + window.location.hash;
      window.location.replace(dest);
    }());
  </script>
</head>
<body>
  <main>
    <img class="spark" src="../inner_orb.png" alt="" aria-hidden="true" />
    <p>Continuing your Littlest Explorer adventure&hellip;<br />
      <a href="https://inner.chottu.link/explorer">Tap here if you're not redirected.</a>
    </p>
  </main>
</body>
</html>
